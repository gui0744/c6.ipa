name: YellowDemo
options:
  bundleIdPrefix: br.demo
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
targets:
  YellowDemo:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - YellowDemo.xcodeproj
          - Config.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.demo.yellow3105
        PRODUCT_NAME: YellowDemo
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
