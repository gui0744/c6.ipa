<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3105 YELLOW</title>
<style>
:root{color-scheme:dark;--y:#ffd21a;--bg:#090909;--card:#171717;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:22px}.wrap{max-width:520px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:900;letter-spacing:2px;color:var(--y);font-size:20px}.badge{font-size:11px;color:var(--muted)}h2{font-size:13px;color:var(--y);letter-spacing:1.5px;margin:24px 0 10px}.card{background:var(--card);border:1px solid #292929;border-radius:14px;padding:15px;margin:9px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-weight:650}.sub{font-size:12px;color:var(--muted);margin-top:4px}input[type=checkbox]{appearance:none;width:44px;height:26px;border-radius:20px;background:#444;position:relative;flex:none}input[type=checkbox]:checked{background:var(--y)}input[type=checkbox]:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}input[type=checkbox]:checked:before{left:21px;background:#111}input[type=range]{width:100%;accent-color:var(--y);margin-top:12px}.value{color:var(--y);font-variant-numeric:tabular-nums}.note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:20px}
</style></head><body><main class="wrap"><header class="top"><div class="brand">3105 YELLOW</div><div class="badge">CONTROL PANEL · 0.1.0</div></header>
<h2>VISUAL</h2><section id="toggles"></section><h2>AJUSTES</h2>
<div class="card"><div class="row"><span class="label">FOV</span><span class="value" id="fovv">90</span></div><input id="fov" type="range" min="10" max="180" value="90"></div>
<div class="card"><div class="row"><span class="label">Aim FOV (demo)</span><span class="value" id="aimv">60</span></div><input id="aimFov" type="range" min="5" max="180" value="60"></div>
<div class="card"><div class="row"><span class="label">Smooth (demo)</span><span class="value" id="smoothv">5</span></div><input id="smooth" type="range" min="1" max="20" value="5"></div>
<p class="note">Preferencias locais de interface. ESP e assistência de mira são apenas controles demonstrativos nesta versão; nenhuma memória de jogo é acessada ou modificada.</p></main>
<script>
const defaults={esp:false,espLine:false,espBox:false,espSkeleton:false,espDistance:false,fovOverlay:true,aimAssistDemo:false};const labels={esp:'ESP',espLine:'ESP Line',espBox:'ESP Box',espSkeleton:'ESP Skeleton',espDistance:'ESP Distance',fovOverlay:'Mostrar FOV',aimAssistDemo:'Aim Assist (demo)'};let state={...defaults};try{state={...state,...JSON.parse(localStorage.getItem('yellow-panel')||'{}')}}catch(e){}const root=document.getElementById('toggles');Object.keys(labels).forEach(k=>{const c=document.createElement('div');c.className='card row';const l=document.createElement('div');l.innerHTML='<div class="label">'+labels[k]+'</div><div class="sub">Preferência local</div>';const i=document.createElement('input');i.type='checkbox';i.checked=!!state[k];i.addEventListener('change',()=>{state[k]=i.checked;save()});c.append(l,i);root.append(c)});function save(){localStorage.setItem('yellow-panel',JSON.stringify(state))}['fov','aimFov','smooth'].forEach(id=>{const el=document.getElementById(id),v=document.getElementById(id+'v');el.addEventListener('input',()=>{v.textContent=el.value;save()})});
</script></body></html>
