name: Build 3105 Yellow IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild \
            -project ios/YellowDemo.xcodeproj \
            -scheme YellowDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YellowDemo.app Payload/
          zip -r 3105-YELLOW-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: 3105-YELLOW-IPA
          path: 3105-YELLOW-unsigned.ipa
